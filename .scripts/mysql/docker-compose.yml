services:
  # MySQL 初始化容器（自动修复权限）
  # 在 MySQL 启动前自动运行，修复数据目录权限问题
  MySQL-init:
    image: mysql:8.0
    container_name: mysql-init
    user: "0:0"
    volumes:
      - ./mysql_data/data:/var/lib/mysql
      - ./mysql_data/log:/var/log/mysql
    command:
      [
        "/bin/bash",
        "-c",
        "mkdir -p /var/lib/mysql /var/log/mysql && chown -R 999:999 /var/lib/mysql /var/log/mysql && chmod -R 755 /var/lib/mysql && chmod -R 755 /var/log/mysql && echo '[MySQL Init] 权限设置完成'",
      ]
    restart: "no"
    networks:
      - yfeieye-network

  # MySQL Server
  MySQL:
    image: mysql:8.0
    container_name: mysql-server
    restart: always
    ports:
      - "3306:3306"
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      - MYSQL_DATABASE=mysql
      - MYSQL_USER=mysql
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - ./mysql_data/data:/var/lib/mysql
      - ./mysql_data/log:/var/log/mysql
      # SQL 文件挂载（按字母顺序执行）
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - yfeieye-network

# 磁盘挂载
volumes:
  mysql_data:
    driver: local

# 网络配置
# 注意：当宿主机IP发生变化后，如果容器无法加入网络，请执行以下命令修复：
# 1. docker network rm yfeieye-network
# 2. docker network create yfeieye-network
# 3. docker-compose restart
networks:
  yfeieye-network:
    name: yfeieye-network
    external: true

